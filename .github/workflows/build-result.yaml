name: Build Result

on:
  push:
    branches:
      - main
    paths:
      - 'result/**'
      - 'docker-compose.yml'
      - '.github/workflows/build-service.yml'
      - '.github/workflows/build-result.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'result/**'
      - 'docker-compose.yml'
      - '.github/workflows/build-service.yml'
      - '.github/workflows/build-result.yml'
permissions:
  id-token: write
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-service.yml

    with:
      service: result

    secrets: inherit