name: Build Service

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ inputs.service }}
        run: |
          docker compose build ${{ inputs.service }}

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/example-voting-app-${{ inputs.service }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push ${{ inputs.service }}
        run: |
          docker compose push ${{ inputs.service }}
  deploy:

    needs: build

    uses: ./.github/workflows/ec2-deploy.yaml