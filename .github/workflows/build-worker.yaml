name: Build Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'docker-compose.yml'
      - '.github/workflows/build-service.yml'
      - '.github/workflows/build-worker.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'docker-compose.yml'
      - '.github/workflows/build-service.yml'
      - '.github/workflows/build-worker.yml'
permissions:
  id-token: write
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-service.yml

    with:
      service: worker

    secrets: inherit